# Always accept PostgreSQL mailing-list infrastructure.
# Matches the ENVELOPE sender (MAIL FROM) domain and only fires when SPF passes,
# so it cannot be spoofed by forging the address. Large negative score keeps the
# message well under the reject threshold regardless of other spam signals.
POSTGRESQL_SPF_ALLOW {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = [
    "postgresql.org",
    "lists.postgresql.org"
  ];
  require_symbols = "R_SPF_ALLOW";
  score = -30.0;
  symbol = "POSTGRESQL_SPF_ALLOW";
}
